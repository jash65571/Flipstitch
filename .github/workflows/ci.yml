name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Test puzzle rules and feedback/playtest units
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Measure levels and validate chapter pacing
        run: npm run analyze:levels

      - name: Check Expo project health
        run: npm run doctor

      - name: Validate audio assets
        run: npm run validate:audio

      - name: Scan for network analytics SDKs
        run: npm run scan:analytics

      - name: Bundle Android
        run: EXPO_NO_TELEMETRY=1 npm run export:android

      - name: Bundle iOS
        run: EXPO_NO_TELEMETRY=1 npm run export:ios

      - name: Bundle web preview
        run: EXPO_NO_TELEMETRY=1 npm run export:web
