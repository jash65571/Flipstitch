name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Test puzzle rules and feedback/playtest units
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Measure levels and validate chapter pacing
        run: npm run analyze:levels

      - name: Check Expo project health
        run: npm run doctor

      - name: Validate audio assets
        run: npm run validate:audio

      - name: Scan for network analytics SDKs
        run: npm run scan:analytics

      # Proves the whole analysis path still runs: generate synthetic bundles
      # (including a corrupt file, a future version, a duplicate, and a
      # developer-channel bundle) and analyse them. The numbers it prints are
      # synthetic and are never evidence about players.
      - name: Rehearse the playtest cohort pipeline end to end
        run: |
          npm run playtest:fixtures -- "$RUNNER_TEMP/rehearsal/bundles"
          npm run playtest:cohort -- "$RUNNER_TEMP/rehearsal/bundles" --observations "$RUNNER_TEMP/rehearsal/observers.csv"

      - name: Bundle Android
        run: EXPO_NO_TELEMETRY=1 npm run export:android

      - name: Bundle iOS
        run: EXPO_NO_TELEMETRY=1 npm run export:ios

      - name: Bundle web preview
        run: EXPO_NO_TELEMETRY=1 npm run export:web
